; PaperAir: an air quality display for the M5Stack PaperDIY
;
;   pio run -e paperdiy -t upload    build and flash the device
;   pio test -e native               run the unit tests on this computer
;   pio run -e preview -t exec       draw the screens to preview/*.png on this computer (needs SDL2)

[platformio]
default_envs = paperdiy

[common]
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

; ---- The device -----------------------------------------------------------
[env:paperdiy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi     ; ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB octal PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  ${common.lib_deps}
  m5stack/M5GFX@0.2.33
  m5stack/M5Unified@0.2.26
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---- Display diagnostic for the device: logs what it finds and drives the e-paper through a
; black / white / bars cycle. pio run -e diag -t upload -------------------------------------
[env:diag]
extends = env:paperdiy
build_src_filter = -<*> +<../diag/diag_main.cpp>

; ---- Unit tests on this computer -------------------------------------------
[env:native]
platform = native
build_flags = -std=c++17
lib_deps = ${common.lib_deps}
lib_ignore = ui
test_build_src = no

; ---- Screen preview on this computer ----------------------------------------
[env:preview]
platform = native
build_flags = -std=c++17 -lSDL2
build_src_filter = -<*> +<../preview/preview_main.cpp>
lib_deps =
  ${common.lib_deps}
  m5stack/M5GFX@0.2.33
